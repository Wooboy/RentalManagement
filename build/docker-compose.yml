services:
  api:
    build:
      context: .
      dockerfile: docker/api-runtime.Dockerfile
    container_name: rental-manager-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=${DB_HOST};Port=${DB_PORT:-5432};Database=${DB_NAME:-rental_manager};Username=${DB_USER:-app_user};Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-RentalManager}
      Jwt__Audience: ${JWT_AUDIENCE:-RentalManagerClient}
      SeedData__ApplyOnStartup: ${SEED_ON_STARTUP:-true}
    volumes:
      - ./seed:/app/Seed:ro
      - ./data/uploads:/app/App_Data/uploads

  web:
    build:
      context: .
      dockerfile: docker/web-runtime.Dockerfile
    container_name: rental-manager-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
