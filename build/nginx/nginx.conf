# 租屋管理系統 nginx 站台設定（WAF → 本機 nginx:80 → Kestrel 127.0.0.1:5091）
# 部署步驟：docs/DEPLOYMENT_UBUNTU.md
# ⚠️ 部署前必須修改：server_name、set_real_ip_from。

# ── 對外協定（http 層，sites-enabled 內的檔案即被 include 於 http 區塊）──
# TLS 在 WAF 終止，本層收到的是 HTTP；以 WAF 帶來的 X-Forwarded-Proto 為準。
# 未帶此標頭（例如主機內部直接測試）時退回本層 $scheme。
# 變數名稱帶站台前綴，避免與同主機其他站台的 map 衝突。
map $http_x_forwarded_proto $rental_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  # 填對外網域（須與 WAF 轉入的 Host 標頭及後端 AllowedHosts 一致）
  server_name rental.example.com;

  # 附件上傳上限（後端 Storage__MaxFileSizeMB 預設 10MB，保留 multipart 額外空間）
  client_max_body_size 20m;

  # build/server-frontend/ 的內容
  root /opt/RentalManager/frontend;
  index index.html;

  # ── 真實用戶端 IP（realip 模組）──────────────────────────────────────
  # 只有來源為 WAF 的請求才採信其 X-Forwarded-For；其他來源一律以 TCP 來源為準，
  # 避免繞過 WAF 直連時偽造 IP。套用後 $remote_addr 即為使用者 IP（日誌同步受惠）。
  # 填網段＝該網段內「任何主機」送來的 X-Forwarded-For 都會被採信，故網段內只應有 WAF／代理設備。
  set_real_ip_from 10.0.0.0/24;   # ⚠️ WAF 在內網側的 IP 或網段
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # 公開 HTTPS 由 WAF 終止，避免 nginx 把內部的 http:// 與埠號寫進 redirect
  absolute_redirect off;

  # ── 安全標頭 ──────────────────────────────────────────────────────────
  # ⚠️ nginx 的 add_header 只在「本層沒有任何 add_header」時才繼承上層，故凡是自帶
  #    add_header（Cache-Control）的 location 都必須重複這組標頭，否則會靜默失效。
  # CSP：Vite 產物為外部模組腳本（無 inline script），故 script-src 'self' 即可；
  #      Vue 的 :style 綁定會產生 inline style 屬性，故 style-src 需 'unsafe-inline'；
  #      附件下載使用 blob: URL。部署後請開瀏覽器 Console 確認無 CSP 違規。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  # HSTS：應在終止 TLS 的 WAF 上送出；確定全站已穩定走 HTTPS 後再啟用。
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # 前端呼叫 /api/...（見 src/services/api.ts），保留前綴原樣轉入。
  # 後端埠號需與 rental-manager-api.env 的 ASPNETCORE_URLS 一致。
  location /api/ {
    proxy_pass http://127.0.0.1:5091/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 以 realip 解析後的使用者 IP「取代」整串轉發鏈
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $rental_forwarded_proto;

    # 安全標頭（本 location 自帶 add_header，需重複——見 server 層說明）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # API 一律不可快取（含帳單、附件等個資）
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # 靜態資產：Vite 產物檔名帶內容雜湊，內容變動即換檔名，故可長期強快取（immutable）。
  location /assets/ {
    try_files $uri =404;
    expires 1y;

    # 安全標頭（本 location 自帶 add_header，需重複——見 server 層說明）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "public, immutable";
  }

  # index.html 不可快取：確保部署新版後前端立即載入新的資產雜湊。
  location = /index.html {
    # 安全標頭（本 location 自帶 add_header，需重複——見 server 層說明）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store, must-revalidate";
  }

  # 單頁式前端（管理端 /admin、房客端 /portal）：一律回退 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
