services:
  db:
    image: postgres:16-alpine
    container_name: rental-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental_manager}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api-runtime.Dockerfile
    container_name: rental-manager-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-rental_manager};Username=${POSTGRES_USER:-app_user};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-RentalManager}
      Jwt__Audience: ${JWT_AUDIENCE:-RentalManagerClient}
      SeedData__ApplyOnStartup: ${SEED_ON_STARTUP:-true}
    volumes:
      - ./seed:/app/Seed:ro
      - uploads_data:/app/App_Data/uploads

  web:
    build:
      context: .
      dockerfile: docker/web-runtime.Dockerfile
    container_name: rental-manager-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads_data:
